<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi, I'm Kourosh - Linux, Networking, Infrastructure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101C33"/>
    </linearGradient>
    <radialGradient id="blobBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8957E5" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8957E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39D0D8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39D0D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="280" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .flow { stroke: #79C0FF; stroke-opacity: 0.5; stroke-width: 1.5; stroke-dasharray: 4 6; animation: flow 2.5s linear infinite; }
    .dot { fill: #3FB950; transform-origin: 82px 215px; animation: pulse 2s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes pulse { 0% { opacity: 0.9; } 100% { opacity: 0.35; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <circle cx="820" cy="40" r="260" fill="url(#blobBlue)"/>
    <circle cx="120" cy="260" r="240" fill="url(#blobPurple)"/>
    <circle cx="520" cy="310" r="170" fill="url(#blobTeal)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="279" rx="16" fill="none" stroke="#30363D"/>

  <!-- Glass card -->
  <rect x="36" y="36" width="928" height="208" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1"/>

  <!-- Text -->
  <text class="sans" x="76" y="92" fill="#8B949E" font-size="13" letter-spacing="3">HI, I'M</text>
  <text class="sans" x="74" y="152" fill="url(#nameGrad)" font-size="62" font-weight="700">Kourosh</text>
  <text class="sans" x="76" y="188" fill="#C9D1D9" font-size="20">Linux  ·  Networking  ·  Infrastructure</text>
  <circle class="dot" cx="82" cy="215" r="4.5"/>
  <text class="sans" x="98" y="220" fill="#8B949E" font-size="14">Open to work  ·  IT student</text>

  <!-- Topology -->
  <g>
    <line class="flow" x1="700" y1="100" x2="800" y2="150"/>
    <line class="flow" x1="890" y1="100" x2="800" y2="150"/>
    <line class="flow" x1="800" y1="150" x2="880" y2="210"/>
    <line class="flow" x1="800" y1="150" x2="720" y2="212"/>

    <!-- Terminal -->
    <rect x="668" y="68" width="64" height="64" rx="16" fill="url(#glass)" stroke="url(#edge)"/>
    <text class="mono" x="700" y="108" text-anchor="middle" fill="#79C0FF" font-size="22" font-weight="600">&gt;_</text>

    <!-- Server -->
    <rect x="858" y="68" width="64" height="64" rx="16" fill="url(#glass)" stroke="url(#edge)"/>
    <rect x="874" y="84" width="32" height="12" rx="3" fill="none" stroke="#79C0FF" stroke-width="1.8"/>
    <rect x="874" y="102" width="32" height="12" rx="3" fill="none" stroke="#79C0FF" stroke-width="1.8"/>
    <circle cx="880" cy="90" r="1.6" fill="#3FB950"/>
    <circle cx="880" cy="108" r="1.6" fill="#3FB950"/>

    <!-- Hub -->
    <rect x="756" y="110" width="88" height="88" rx="22" fill="url(#glass)" stroke="url(#edge)"/>
    <circle cx="800" cy="136" r="5" fill="#79C0FF"/>
    <circle cx="780" cy="172" r="5" fill="#79C0FF"/>
    <circle cx="820" cy="172" r="5" fill="#79C0FF"/>
    <line x1="800" y1="136" x2="780" y2="172" stroke="#79C0FF" stroke-width="1.8"/>
    <line x1="800" y1="136" x2="820" y2="172" stroke="#79C0FF" stroke-width="1.8"/>
    <line x1="780" y1="172" x2="820" y2="172" stroke="#79C0FF" stroke-width="1.8"/>

    <!-- Small nodes -->
    <circle cx="880" cy="210" r="7" fill="url(#glass)" stroke="url(#edge)"/>
    <circle cx="720" cy="212" r="7" fill="url(#glass)" stroke="url(#edge)"/>
  </g>
</svg>
