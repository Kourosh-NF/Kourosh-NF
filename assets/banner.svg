<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kourosh - Linux, Networking, Infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .prompt { fill: #3FB950; font-size: 15px; }
    .cmd { fill: #C9D1D9; font-size: 15px; }
    .out { fill: #58A6FF; font-size: 15px; }
    .dim { fill: #8B949E; font-size: 13px; }
    .cursor { fill: #58A6FF; animation: blink 1s steps(1) infinite; }
    .link { stroke: #1F6FEB; stroke-opacity: 0.45; stroke-width: 1.5; }
    .node { fill: #0D1117; stroke: #58A6FF; stroke-width: 2; }
    .pulse { fill: none; stroke: #58A6FF; stroke-width: 1.5; transform-origin: 790px 140px; animation: pulse 3s ease-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(2.4); opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="url(#bg)" stroke="#30363D"/>
  <circle cx="790" cy="140" r="190" fill="url(#glow)"/>

  <!-- Network topology -->
  <g>
    <line class="link" x1="790" y1="140" x2="650" y2="70"/>
    <line class="link" x1="790" y1="140" x2="640" y2="190"/>
    <line class="link" x1="790" y1="140" x2="720" y2="240"/>
    <line class="link" x1="790" y1="140" x2="890" y2="55"/>
    <line class="link" x1="790" y1="140" x2="940" y2="150"/>
    <line class="link" x1="790" y1="140" x2="860" y2="238"/>
    <line class="link" x1="650" y1="70" x2="890" y2="55"/>
    <line class="link" x1="940" y1="150" x2="860" y2="238"/>
    <line class="link" x1="640" y1="190" x2="720" y2="240"/>

    <circle class="node" cx="650" cy="70" r="7"/>
    <circle class="node" cx="640" cy="190" r="7"/>
    <circle class="node" cx="720" cy="240" r="7"/>
    <circle class="node" cx="890" cy="55" r="7"/>
    <circle class="node" cx="940" cy="150" r="7"/>
    <circle class="node" cx="860" cy="238" r="7"/>

    <circle class="pulse" cx="790" cy="140" r="22"/>
    <circle class="node" cx="790" cy="140" r="20"/>
    <circle cx="790" cy="140" r="9" fill="#58A6FF"/>
  </g>

  <!-- Terminal window -->
  <rect x="30" y="30" width="540" height="220" rx="10" fill="#010409" fill-opacity="0.92" stroke="#30363D"/>
  <path d="M30 40 a10 10 0 0 1 10 -10 h520 a10 10 0 0 1 10 10 v18 h-540 z" fill="#161B22"/>
  <circle cx="52" cy="44" r="5" fill="#FF5F56"/>
  <circle cx="72" cy="44" r="5" fill="#FFBD2E"/>
  <circle cx="92" cy="44" r="5" fill="#27C93F"/>
  <text class="mono dim" x="300" y="48" text-anchor="middle">kourosh@linux: ~</text>

  <text class="mono prompt" x="50" y="92">kourosh@linux:~$</text>
  <text class="mono cmd" x="205" y="92">whoami</text>
  <text class="mono out" x="50" y="118">Kourosh | Linux &amp; Network Enthusiast</text>

  <text class="mono prompt" x="50" y="156">kourosh@linux:~$</text>
  <text class="mono cmd" x="205" y="156">cat focus.txt</text>
  <text class="mono out" x="50" y="182">Linux · Networking · Infrastructure</text>

  <text class="mono prompt" x="50" y="220">kourosh@linux:~$</text>
  <rect class="cursor" x="206" y="206" width="10" height="18"/>
</svg>
