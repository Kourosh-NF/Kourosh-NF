o','Fira Code',Consolas,'Courier New',monospace" x="24" y="198" font-size="14"><tspan fill="#A8B3C1">IT Support</tspan></text></g><g class="ln" style="animation-delay:2.00s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="24" y="230" font-size="14"><tspan fill="#3FB950">kourosh@linux</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$</tspan><tspan fill="#E6EDF3"> echo $MOTTO</tspan></text></g><g class="ln" style="animation-delay:2.30s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="24" y="252" font-size="14"><tspan fill="#A8B3C1">Building practical labs, writing tools,</tspan></text></g><g class="ln" style="animation-delay:2.60s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="24" y="274" font-size="14"><tspan fill="#A8B3C1">and documenting what I learn.</tspan></text></g><g class="ln" style="animation-delay:2.90s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="24" y="306" font-size="14"><tspan fill="#3FB950">kourosh@linux</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$</tspan></text></g><rect class="cur" x="172.8" y="293" width="8" height="16" rx="1" fill="#79C0FF"/>
